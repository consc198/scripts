---
- name: Enroll WordPress security monitoring agents
  hosts: wordpress
  become: true
  gather_facts: true
  vars:
    security_monitor_url: "https://security.example.com"
    enrollment_token: "{{ vault_enrollment_token }}"
    agent_config_dir: /etc/security-monitor
    site_root: /var/www/html
  tasks:
    - name: Create agent configuration directory
      ansible.builtin.file:
        path: "{{ agent_config_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Create agent queue directory
      ansible.builtin.file:
        path: /var/lib/wp-malware-monitor/queue
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Install monitoring agent
      ansible.builtin.copy:
        src: ../agent/agent.py
        dest: /usr/local/sbin/wp-malware-monitor-agent
        owner: root
        group: root
        mode: '0700'

    - name: Install enrollment script
      ansible.builtin.copy:
        src: ../agent/enroll.sh
        dest: /usr/local/sbin/security-monitor-enroll
        owner: root
        group: root
        mode: '0700'

    - name: Enroll host once
      ansible.builtin.command:
        cmd: /usr/local/sbin/security-monitor-enroll
      environment:
        SECURITY_MONITOR_URL: "{{ security_monitor_url }}"
        ENROLLMENT_TOKEN: "{{ enrollment_token }}"
        HOSTNAME_VALUE: "{{ ansible_fqdn }}"
        SITE_URL: "{{ site_url | default('') }}"
        SITE_ROOT: "{{ site_root }}"
      register: enrollment_result
      no_log: true
      changed_when: true
      when: not (agent_config_dir + '/agent.json') is file

    - name: Verify enrolled agent configuration exists
      ansible.builtin.stat:
        path: "{{ agent_config_dir }}/agent.json"
      register: agent_config

    - name: Refuse deployment if enrollment did not produce credentials
      ansible.builtin.assert:
        that:
          - agent_config.stat.exists
          - agent_config.stat.mode == '0600'
        fail_msg: "Agent enrollment did not produce a protected agent configuration."
